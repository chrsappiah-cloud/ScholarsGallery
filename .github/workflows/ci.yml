name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SPM library modules ───────────────────────────────────────
  spm-modules:
    name: Build SPM Modules
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-modules-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-modules-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build GalleryCore
        run: swift build --target GalleryCore

      - name: Build GalleryUI
        run: swift build --target GalleryUI

      - name: Build GalleryApp
        run: swift build --target GalleryApp

  # ── Vapor server build + tests ──────────────────────────────────
  server:
    name: Server Build & Test
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build server
        run: swift build --product ScholarsGalleryServer

      - name: Run server tests
        run: swift test --filter ScholarsGalleryServerTests
        timeout-minutes: 20

  # ── iOS app build + unit tests ──────────────────────────────────
  ios:
    name: iOS Build & Unit Tests
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [spm-modules]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode and detect simulator
        id: xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

          SIM_INFO="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "-j"
          ], text=True))
          device_types = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devicetypes", "-j"
          ], text=True))
          candidates = []

          for runtime, runtime_devices in devices["devices"].items():
              if "iOS" not in runtime:
                  continue

              runtime_key = runtime.split(".")[-1].replace("iOS-", "")
              runtime_parts = tuple(int(part) for part in runtime_key.split("-") if part.isdigit())
              runtime_version = ".".join(str(part) for part in runtime_parts) or runtime_key

              for device in runtime_devices:
                  if not device.get("isAvailable", True):
                      continue
                  if "iPhone" not in device.get("name", ""):
                      continue
                  candidates.append((runtime_parts, device["name"], runtime, runtime_version))

          if not candidates:
              raise SystemExit("No available iPhone simulator found")

          _, name, runtime_identifier, runtime_version = max(candidates)

          matching_device_types = [
              item for item in device_types["devicetypes"]
              if item.get("name") == name and "iPhone" in item.get("name", "")
          ]
          if not matching_device_types:
              raise SystemExit(f"No device type found for simulator named {name}")

          print(name)
          print(matching_device_types[0]["identifier"])
          print(runtime_identifier)
          print(runtime_version)
          PY
          )"
          SIM_NAME="$(printf '%s\n' "$SIM_INFO" | sed -n '1p')"
          SIM_DEVICE_TYPE_ID="$(printf '%s\n' "$SIM_INFO" | sed -n '2p')"
          SIM_RUNTIME_ID="$(printf '%s\n' "$SIM_INFO" | sed -n '3p')"
          SIM_OS="$(printf '%s\n' "$SIM_INFO" | sed -n '4p')"
          SIM_INSTANCE_NAME="CI-${SIM_NAME// /-}-${GITHUB_RUN_ID}"
          SIM_ID="$(xcrun simctl create "$SIM_INSTANCE_NAME" "$SIM_DEVICE_TYPE_ID" "$SIM_RUNTIME_ID")"
          xcrun simctl boot "$SIM_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "simulator=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "simulator_os=$SIM_OS" >> "$GITHUB_OUTPUT"
          echo "Detected simulator: $SIM_INSTANCE_NAME ($SIM_ID, OS $SIM_OS)"

      - name: Build iOS app
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'id=${{ steps.xcode.outputs.simulator_id }}' \
            build

      - name: Run unit tests
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'id=${{ steps.xcode.outputs.simulator_id }}' \
            -only-testing:ScholarsGalleryTests \
            test

  # ── iOS UI tests ────────────────────────────────────────────────
  ui-tests:
    name: iOS UI Tests
    runs-on: macos-latest
    timeout-minutes: 40
    needs: [ios]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode and detect simulator
        id: xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          SIM_INFO="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "-j"
          ], text=True))
          device_types = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devicetypes", "-j"
          ], text=True))
          candidates = []

          for runtime, runtime_devices in devices["devices"].items():
              if "iOS" not in runtime:
                  continue

              runtime_key = runtime.split(".")[-1].replace("iOS-", "")
              runtime_parts = tuple(int(part) for part in runtime_key.split("-") if part.isdigit())
              runtime_version = ".".join(str(part) for part in runtime_parts) or runtime_key

              for device in runtime_devices:
                  if not device.get("isAvailable", True):
                      continue
                  if "iPhone" not in device.get("name", ""):
                      continue
                  candidates.append((runtime_parts, device["name"], runtime, runtime_version))

          if not candidates:
              raise SystemExit("No available iPhone simulator found")

          _, name, runtime_identifier, runtime_version = max(candidates)

          matching_device_types = [
              item for item in device_types["devicetypes"]
              if item.get("name") == name and "iPhone" in item.get("name", "")
          ]
          if not matching_device_types:
              raise SystemExit(f"No device type found for simulator named {name}")

          print(name)
          print(matching_device_types[0]["identifier"])
          print(runtime_identifier)
          print(runtime_version)
          PY
          )"
          SIM_NAME="$(printf '%s\n' "$SIM_INFO" | sed -n '1p')"
          SIM_DEVICE_TYPE_ID="$(printf '%s\n' "$SIM_INFO" | sed -n '2p')"
          SIM_RUNTIME_ID="$(printf '%s\n' "$SIM_INFO" | sed -n '3p')"
          SIM_OS="$(printf '%s\n' "$SIM_INFO" | sed -n '4p')"
          SIM_INSTANCE_NAME="CI-${SIM_NAME// /-}-${GITHUB_RUN_ID}"
          SIM_ID="$(xcrun simctl create "$SIM_INSTANCE_NAME" "$SIM_DEVICE_TYPE_ID" "$SIM_RUNTIME_ID")"
          echo "simulator=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "simulator_os=$SIM_OS" >> "$GITHUB_OUTPUT"

      - name: Run UI tests
        run: |
          IOS_TEST_DESTINATION='platform=iOS Simulator,id=${{ steps.xcode.outputs.simulator_id }}' \
            ./ci_scripts/run_ui_tests.sh

  # ── Smoke test (server endpoints) ───────────────────────────────
  smoke:
    name: Server Smoke Test
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [server]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Build and start server
        run: |
          ./Scripts/smoke_verify_server.sh
