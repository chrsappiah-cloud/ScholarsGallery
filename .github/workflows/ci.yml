name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SPM library modules ───────────────────────────────────────
  spm-modules:
    name: Build SPM Modules
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-modules-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-modules-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build GalleryCore
        run: swift build --target GalleryCore

      - name: Build GalleryUI
        run: swift build --target GalleryUI

      - name: Build GalleryApp
        run: swift build --target GalleryApp

  # ── Vapor server build + tests ──────────────────────────────────
  server:
    name: Server Build & Test
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build server
        run: swift build --product ScholarsGalleryServer

      - name: Run server tests
        run: swift test --filter ScholarsGalleryServerTests
        timeout-minutes: 20

  # ── iOS app build + unit tests ──────────────────────────────────
  ios:
    name: iOS Build & Unit Tests
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [spm-modules]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode and detect simulator
        id: xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

          SIM_JSON="$(xcrun simctl list devices available -j)"
          SIM_INFO="$(SIM_JSON="$SIM_JSON" python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["SIM_JSON"])
          candidates = []

          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue

              runtime_key = runtime.split(".")[-1].replace("iOS-", "")
              runtime_parts = tuple(int(part) for part in runtime_key.split("-") if part.isdigit())

              for device in devices:
                  if not device.get("isAvailable", True):
                      continue
                  if "iPhone" not in device.get("name", ""):
                      continue
                  candidates.append((runtime_parts, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone simulator found")

          _, name, udid = max(candidates)
          print(name)
          print(udid)
          PY
          )"
          SIM_NAME="$(printf '%s\n' "$SIM_INFO" | sed -n '1p')"
          SIM_ID="$(printf '%s\n' "$SIM_INFO" | sed -n '2p')"
          xcrun simctl boot \"$SIM_ID\" >/dev/null 2>&1 || true
          xcrun simctl bootstatus \"$SIM_ID\" -b
          echo "simulator=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Detected simulator: $SIM_NAME"

      - name: Build iOS app
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=${{ steps.xcode.outputs.simulator }}' \
            build

      - name: Run unit tests
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=${{ steps.xcode.outputs.simulator }}' \
            -only-testing:ScholarsGalleryTests \
            test

  # ── iOS UI tests ────────────────────────────────────────────────
  ui-tests:
    name: iOS UI Tests
    runs-on: macos-latest
    timeout-minutes: 40
    needs: [ios]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode and detect simulator
        id: xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          SIM_JSON="$(xcrun simctl list devices available -j)"
          SIM_INFO="$(SIM_JSON="$SIM_JSON" python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["SIM_JSON"])
          candidates = []

          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue

              runtime_key = runtime.split(".")[-1].replace("iOS-", "")
              runtime_parts = tuple(int(part) for part in runtime_key.split("-") if part.isdigit())

              for device in devices:
                  if not device.get("isAvailable", True):
                      continue
                  if "iPhone" not in device.get("name", ""):
                      continue
                  candidates.append((runtime_parts, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone simulator found")

          _, name, udid = max(candidates)
          print(name)
          print(udid)
          PY
          )"
          SIM_NAME="$(printf '%s\n' "$SIM_INFO" | sed -n '1p')"
          SIM_ID="$(printf '%s\n' "$SIM_INFO" | sed -n '2p')"
          echo "simulator=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Run UI tests
        run: |
          IOS_TEST_DESTINATION='platform=iOS Simulator,id=${{ steps.xcode.outputs.simulator_id }}' \
            ./ci_scripts/run_ui_tests.sh

  # ── Smoke test (server endpoints) ───────────────────────────────
  smoke:
    name: Server Smoke Test
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [server]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Build and start server
        run: |
          ./Scripts/smoke_verify_server.sh
