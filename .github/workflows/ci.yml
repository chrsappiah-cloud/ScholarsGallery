name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SPM library modules ───────────────────────────────────────
  spm-modules:
    name: Build SPM Modules
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-modules-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-modules-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build GalleryCore
        run: swift build --target GalleryCore

      - name: Build GalleryUI
        run: swift build --target GalleryUI

      - name: Build GalleryApp
        run: swift build --target GalleryApp

  # ── Vapor server build + tests ──────────────────────────────────
  server:
    name: Server Build & Test
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build server
        run: swift build --product ScholarsGalleryServer

      - name: Run server tests
        run: swift test --filter ScholarsGalleryServerTests
        timeout-minutes: 40

  # ── iOS app build + unit tests ──────────────────────────────────
  ios:
    name: iOS Build & Unit Tests
    runs-on: macos-latest
    timeout-minutes: 75
    needs: [spm-modules]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.x and find best simulator destination
        id: xcode
        run: |
          # Use latest Xcode. iOS simulator DVT is broken (shows placeholder only),
          # but visionOS "Designed for [iPad,iPhone]" destinations ARE registered.
          # find_simulator.py queries -showdestinations and picks iOS (if available)
          # or visionOS Designed-for-iPad/iPhone as a reliable fallback.
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -5 || true
          SIM_ID=$(python3 ci_scripts/find_simulator.py)
          xcrun simctl boot "$SIM_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_ID" -b 2>/dev/null || true
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_ID"

      - name: Build iOS app
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -destination 'id=${{ steps.xcode.outputs.simulator_id }}' \
            build

      - name: Run unit tests
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -destination 'id=${{ steps.xcode.outputs.simulator_id }}' \
            -only-testing:ScholarsGalleryTests \
            test

  # ── AIFinance Trading Lab (Xcode project: unit + UI tests) ─────
  aifinance-lab:
    name: AIFinance Trading Lab Tests
    runs-on: macos-latest
    timeout-minutes: 35
    needs: [spm-modules]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.x and find iOS Simulator for AIFinance
        id: xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -5 || true
          SIM_ID=$(python3 ci_scripts/find_simulator_aifinance.py)
          xcrun simctl boot "$SIM_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_ID" -b 2>/dev/null || true
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_ID"

      - name: Run AIFinanceTradingLab tests
        run: |
          xcodebuild test \
            -project AIFinanceTradingLab/AIFinanceTradingLab.xcodeproj \
            -scheme AIFinanceTradingLab \
            -destination "platform=iOS Simulator,id=${{ steps.xcode.outputs.simulator_id }}"

  # ── iOS UI tests ────────────────────────────────────────────────
  ui-tests:
    name: iOS UI Tests
    runs-on: macos-latest
    timeout-minutes: 55
    needs: [ios, aifinance-lab]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.x and find best simulator destination
        id: xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -5 || true
          SIM_ID=$(python3 ci_scripts/find_simulator.py)
          xcrun simctl boot "$SIM_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_ID" -b 2>/dev/null || true
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_ID"

      - name: Run UI tests
        run: |
          IOS_TEST_DESTINATION='platform=iOS Simulator,id=${{ steps.xcode.outputs.simulator_id }}' \
            ./ci_scripts/run_ui_tests.sh

  # ── Smoke test (server endpoints) ───────────────────────────────
  smoke:
    name: Server Smoke Test
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [server]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Build and start server
        run: |
          ./Scripts/smoke_verify_server.sh

  # ── Release archive validation ────────────────────────────────────
  release-archive:
    name: Release Archive Validation
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [spm-modules]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Build unsigned Release archive
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ci-release/ScholarsGallery.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

  # ── Required status gate for branch protection / CD ───────────────
  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    needs: [spm-modules, server, ios, aifinance-lab, ui-tests, smoke, release-archive]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        env:
          SPM: ${{ needs.spm-modules.result }}
          SERVER: ${{ needs.server.result }}
          IOS: ${{ needs.ios.result }}
          AIFINANCE: ${{ needs.aifinance-lab.result }}
          UI: ${{ needs.ui-tests.result }}
          SMOKE: ${{ needs.smoke.result }}
          RELEASE_ARCHIVE: ${{ needs.release-archive.result }}
        run: |
          set -euo pipefail
          for name in SPM SERVER IOS AIFINANCE UI SMOKE RELEASE_ARCHIVE; do
            result="${!name}"
            if [[ "$result" != "success" ]]; then
              echo "$name job result: $result (expected success)"
              exit 1
            fi
          done
          echo "All CI jobs succeeded."
