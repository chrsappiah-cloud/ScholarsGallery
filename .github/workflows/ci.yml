name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  SWIFT_VERSION: "5.10"

jobs:
  # ── Vapor server build + tests ──────────────────────────────────
  server:
    name: Server Build & Test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build server
        run: swift build --product ScholarsGalleryServer

      - name: Run server tests
        run: swift test --filter ScholarsGalleryServerTests

  # ── iOS app build + unit tests ──────────────────────────────────
  ios:
    name: iOS Build & Unit Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS app
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            build

      - name: Run unit tests
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:ScholarsGalleryTests \
            test

  # ── iOS UI tests ────────────────────────────────────────────────
  ui-tests:
    name: iOS UI Tests
    runs-on: macos-15
    timeout-minutes: 40
    needs: [ios]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run UI tests
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:ScholarsGalleryUITests \
            -disable-concurrent-testing \
            test

  # ── Smoke test (server endpoints) ───────────────────────────────
  smoke:
    name: Server Smoke Test
    runs-on: macos-15
    timeout-minutes: 10
    needs: [server]
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Build and start server
        run: |
          swift build --product ScholarsGalleryServer
          swift run ScholarsGalleryServer &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Smoke test endpoints
        run: |
          set -e
          echo "Testing /api/meta..."
          curl -sf http://127.0.0.1:8080/api/meta | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'], 'meta not ok'"

          echo "Testing /api/exhibitions..."
          curl -sf http://127.0.0.1:8080/api/exhibitions | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d) > 0, 'no exhibitions'"

          echo "Testing /api/essays..."
          curl -sf http://127.0.0.1:8080/api/essays | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d) > 0, 'no essays'"

          echo "Testing /api/artworks/generated..."
          curl -sf http://127.0.0.1:8080/api/artworks/generated

          echo "All smoke tests passed"

      - name: Stop server
        if: always()
        run: kill ${{ env.SERVER_PID }} 2>/dev/null || true
