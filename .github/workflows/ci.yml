name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SPM library modules ───────────────────────────────────────
  spm-modules:
    name: Build SPM Modules
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-modules-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-modules-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build GalleryCore
        run: swift build --target GalleryCore

      - name: Build GalleryUI
        run: swift build --target GalleryUI

      - name: Build GalleryApp
        run: swift build --target GalleryApp

  # ── Vapor server build + tests ──────────────────────────────────
  server:
    name: Server Build & Test
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build server
        run: swift build --product ScholarsGalleryServer

      - name: Run server tests
        run: swift test --filter ScholarsGalleryServerTests
        timeout-minutes: 40

  # ── iOS app build + unit tests ──────────────────────────────────
  ios:
    name: iOS Build & Unit Tests
    runs-on: macos-latest
    timeout-minutes: 75
    needs: [spm-modules]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.x and register iOS simulator platform
        id: xcode
        run: |
          # Runtimes on this runner are disk images (Xcode 26 format) — only
          # Xcode 26.x can mount them. xcodebuild -downloadPlatform iOS registers
          # the mounted runtime with DVT so concrete device destinations appear.
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -5 || true
          echo "Registering iOS simulator platform with DVT…"
          xcodebuild -downloadPlatform iOS 2>&1 | tail -10 || true
          echo "=== destinations after platform registration ==="
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery -showdestinations 2>&1 \
            | grep -E "(platform|id:|name:)" | head -20 || true
          SIM_ID=$(python3 ci_scripts/find_simulator.py)
          xcrun simctl boot "$SIM_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_ID"

      - name: Build iOS app
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'id=${{ steps.xcode.outputs.simulator_id }}' \
            build

      - name: Run unit tests
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'id=${{ steps.xcode.outputs.simulator_id }}' \
            -only-testing:ScholarsGalleryTests \
            test

  # ── iOS UI tests ────────────────────────────────────────────────
  ui-tests:
    name: iOS UI Tests
    runs-on: macos-latest
    timeout-minutes: 55
    needs: [ios]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.x and register iOS simulator platform
        id: xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -5 || true
          xcodebuild -downloadPlatform iOS 2>&1 | tail -10 || true
          SIM_ID=$(python3 ci_scripts/find_simulator.py)
          xcrun simctl boot "$SIM_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_ID"

      - name: Run UI tests
        run: |
          IOS_TEST_DESTINATION='platform=iOS Simulator,id=${{ steps.xcode.outputs.simulator_id }}' \
            ./ci_scripts/run_ui_tests.sh

  # ── Smoke test (server endpoints) ───────────────────────────────
  smoke:
    name: Server Smoke Test
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [server]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Build and start server
        run: |
          ./Scripts/smoke_verify_server.sh
