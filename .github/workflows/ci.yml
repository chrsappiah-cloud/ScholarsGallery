name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SPM library modules ───────────────────────────────────────
  spm-modules:
    name: Build SPM Modules
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-modules-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-modules-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build GalleryCore
        run: swift build --target GalleryCore

      - name: Build GalleryUI
        run: swift build --target GalleryUI

      - name: Build GalleryApp
        run: swift build --target GalleryApp

  # ── Vapor server build + tests ──────────────────────────────────
  server:
    name: Server Build & Test
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build server
        run: swift build --product ScholarsGalleryServer

      - name: Run server tests
        run: swift test --filter ScholarsGalleryServerTests
        timeout-minutes: 40

  # ── iOS app build + unit tests ──────────────────────────────────
  ios:
    name: iOS Build & Unit Tests
    runs-on: macos-latest
    timeout-minutes: 40
    needs: [spm-modules]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and find simulator
        id: xcode
        run: |
          # Prefer Xcode 16.x: it ships with iOS 18.x simulator runtimes pre-registered
          # in DVT. Xcode 26.x on CI runners has a decoupled runtime model that requires
          # additional installation steps not yet stable on GitHub-hosted runners.
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE_PATH" ]]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

          SIM_INFO="$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], text=True))
          candidates = []
          for runtime, devs in devices["devices"].items():
              if "iOS" not in runtime:
                  continue
              parts = runtime.split(".")[-1].replace("iOS-", "")
              ver = tuple(int(x) for x in parts.split("-") if x.isdigit())
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((ver, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          ver, name, udid = max(candidates)
          print(udid)
          print(name)
          print(".".join(str(v) for v in ver))
          PY
          )"
          SIM_ID="$(printf '%s\n' "$SIM_INFO" | sed -n '1p')"
          SIM_NAME="$(printf '%s\n' "$SIM_INFO" | sed -n '2p')"
          SIM_OS="$(printf '%s\n' "$SIM_INFO" | sed -n '3p')"
          xcrun simctl boot "$SIM_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Booted: $SIM_NAME ($SIM_ID, iOS $SIM_OS)"

      - name: Build iOS app
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'id=${{ steps.xcode.outputs.simulator_id }}' \
            build

      - name: Run unit tests
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'id=${{ steps.xcode.outputs.simulator_id }}' \
            -only-testing:ScholarsGalleryTests \
            test

  # ── iOS UI tests ────────────────────────────────────────────────
  ui-tests:
    name: iOS UI Tests
    runs-on: macos-latest
    timeout-minutes: 55
    needs: [ios]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode and find simulator
        id: xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -3

          SIM_INFO="$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], text=True))
          candidates = []
          for runtime, devs in devices["devices"].items():
              if "iOS" not in runtime:
                  continue
              parts = runtime.split(".")[-1].replace("iOS-", "")
              ver = tuple(int(x) for x in parts.split("-") if x.isdigit())
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((ver, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          ver, name, udid = max(candidates)
          print(udid)
          print(name)
          print(".".join(str(v) for v in ver))
          PY
          )"
          SIM_ID="$(printf '%s\n' "$SIM_INFO" | sed -n '1p')"
          SIM_NAME="$(printf '%s\n' "$SIM_INFO" | sed -n '2p')"
          SIM_OS="$(printf '%s\n' "$SIM_INFO" | sed -n '3p')"
          xcrun simctl boot "$SIM_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "simulator_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Booted: $SIM_NAME ($SIM_ID, iOS $SIM_OS)"

      - name: Run UI tests
        run: |
          IOS_TEST_DESTINATION='platform=iOS Simulator,id=${{ steps.xcode.outputs.simulator_id }}' \
            ./ci_scripts/run_ui_tests.sh

  # ── Smoke test (server endpoints) ───────────────────────────────
  smoke:
    name: Server Smoke Test
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [server]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-server-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-server-

      - name: Build and start server
        run: |
          ./Scripts/smoke_verify_server.sh
