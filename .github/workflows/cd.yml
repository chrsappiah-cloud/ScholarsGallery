name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  # ── Gate: full CI must pass ─────────────────────────────────────
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ── Archive iOS app ─────────────────────────────────────────────
  archive:
    name: Archive iOS App
    runs-on: macos-15
    timeout-minutes: 30
    needs: [ci-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Archive
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ScholarsGallery.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScholarsGallery-archive
          path: build/ScholarsGallery.xcarchive
          retention-days: 30

  # ── Build server Docker image (optional) ────────────────────────
  server-image:
    name: Build Server Image
    runs-on: macos-15
    timeout-minutes: 20
    needs: [ci-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Build release server binary
        run: swift build -c release --product ScholarsGalleryServer

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: ScholarsGalleryServer-release
          path: .build/release/ScholarsGalleryServer
          retention-days: 30

  # ── GitHub Release ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [archive, server-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ScholarsGalleryServer-release/ScholarsGalleryServer
