name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      upload_to_testflight:
        description: "Upload the signed build to TestFlight when signing secrets are configured"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    # CD must not run unless the reusable CI workflow (including CI Success Gate) passes.

  resolve-environment:
    name: Resolve deployment environment
    runs-on: ubuntu-latest
    outputs:
      deploy_environment: ${{ steps.resolve.outputs.deploy_environment }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_ENVIRONMENT:-}" ]]; then
            deploy_environment="$INPUT_ENVIRONMENT"
          elif [[ "$REF_NAME" == refs/tags/v* ]]; then
            deploy_environment="production"
          else
            deploy_environment="staging"
          fi
          echo "deploy_environment=$deploy_environment" >> "$GITHUB_OUTPUT"

  archive:
    name: Archive iOS App
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [ci-gate, resolve-environment]
    environment: ${{ needs.resolve-environment.outputs.deploy_environment }}
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
    outputs:
      signing_ready: ${{ steps.preflight.outputs.signing_ready }}
      should_upload_testflight: ${{ steps.preflight.outputs.should_upload_testflight }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Check signing inputs
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          INPUT_UPLOAD_TO_TESTFLIGHT: ${{ github.event.inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          missing=()
          required=(
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_API_KEY_BASE64
            BUILD_CERTIFICATE_BASE64
            P12_PASSWORD
            BUILD_PROVISION_PROFILE_BASE64
            KEYCHAIN_PASSWORD
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          signing_ready=false
          if [[ ${#missing[@]} -eq 0 ]]; then
            signing_ready=true
          fi

          should_upload=false
          if [[ "$EVENT_NAME" == "push" && ( "$REF_NAME" == "refs/heads/main" || "$REF_NAME" == refs/tags/v* ) ]]; then
            should_upload=true
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${INPUT_UPLOAD_TO_TESTFLIGHT:-true}" == "true" ]]; then
            should_upload=true
          fi

          echo "signing_ready=$signing_ready" >> "$GITHUB_OUTPUT"
          echo "should_upload_testflight=$should_upload" >> "$GITHUB_OUTPUT"

          if [[ "$signing_ready" != "true" ]]; then
            echo "Missing signing secrets: ${missing[*]}"
            if [[ "$should_upload" == "true" ]]; then
              echo "::error::TestFlight upload requested but signing secrets are not configured in the selected GitHub environment."
              exit 1
            fi
          fi

      - name: Archive unsigned build
        run: |
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/unsigned/ScholarsGallery.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScholarsGallery-archive-unsigned
          path: build/unsigned/ScholarsGallery.xcarchive
          retention-days: 30

      - name: Install signing certificate and profile
        if: steps.preflight.outputs.signing_ready == 'true'
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if ! echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null; then
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          fi
          if ! echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH" 2>/dev/null; then
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Configure App Store Connect API key
        if: steps.preflight.outputs.signing_ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          API_KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if ! echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH" 2>/dev/null; then
            echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          fi
          chmod 600 "$API_KEY_PATH"

      - name: Archive signed build
        if: steps.preflight.outputs.signing_ready == 'true'
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ -n "${IOS_TEAM_ID:-}" ]]; then
            EXTRA_ARGS+=(DEVELOPMENT_TEAM="$IOS_TEAM_ID")
          fi
          if [[ -n "${IOS_SIGNING_IDENTITY:-}" ]]; then
            EXTRA_ARGS+=(CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY")
          fi
          xcodebuild -project ScholarsGallery.xcodeproj \
            -scheme ScholarsGallery \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/testflight/ScholarsGallery.xcarchive \
            -allowProvisioningUpdates \
            archive \
            "${EXTRA_ARGS[@]}"

      - name: Export signed IPA
        if: steps.preflight.outputs.signing_ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/testflight/ScholarsGallery.xcarchive \
            -exportPath build/testflight/export \
            -exportOptionsPlist ci_scripts/ExportOptions-testflight.plist \
            -allowProvisioningUpdates

      - name: Upload signed TestFlight artifacts
        if: steps.preflight.outputs.signing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScholarsGallery-testflight
          path: |
            build/testflight/ScholarsGallery.xcarchive
            build/testflight/export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: steps.preflight.outputs.signing_ready == 'true' && steps.preflight.outputs.should_upload_testflight == 'true'
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/testflight/export -name '*.ipa' | head -n 1)
          if [[ -z "$IPA_PATH" ]]; then
            echo "No IPA exported for TestFlight upload."
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

  server-image:
    name: Build Server Binary
    runs-on: macos-latest
    timeout-minutes: 20
    needs: [ci-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"

      - name: Build release server binary
        run: swift build -c release --product ScholarsGalleryServer

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: ScholarsGalleryServer-release
          path: .build/release/ScholarsGalleryServer
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [archive, server-image]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ScholarsGalleryServer-release/ScholarsGalleryServer
