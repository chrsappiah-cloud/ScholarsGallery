name: AIFinanceTradingLab
options:
  bundleIdPrefix: com.scholarslab
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  AIFinanceCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AIFinanceCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceCore
      SKIP_INSTALL: YES

  AIFinanceUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AIFinanceUI
    dependencies:
      - target: AIFinanceCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceUI
      SKIP_INSTALL: YES

  AIFinanceTradingLab:
    type: application
    platform: iOS
    sources:
      - path: Sources/AIFinanceTradingLab
    dependencies:
      - target: AIFinanceCore
      - target: AIFinanceUI
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: AIFinance
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceTradingLab
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic

  AIFinanceCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AIFinanceCoreTests
    dependencies:
      - target: AIFinanceCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceCoreTests

  AIFinanceTradingLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/AIFinanceTradingLabUITests
    dependencies:
      - target: AIFinanceTradingLab
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceTradingLabUITests

# Explicit scheme so ⌘U / `xcodebuild test` runs the Swift Testing bundle.
schemes:
  AIFinanceTradingLab:
    build:
      targets:
        AIFinanceTradingLab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AIFinanceCoreTests
        - name: AIFinanceTradingLabUITests
