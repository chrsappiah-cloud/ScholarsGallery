name: AIFinanceTradingLab
options:
  bundleIdPrefix: com.scholarslab
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  AIFinanceCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AIFinanceCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceCore
      SKIP_INSTALL: YES

  AIFinanceUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AIFinanceUI
    dependencies:
      - target: AIFinanceCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceUI
      SKIP_INSTALL: YES

  AIFinanceTradingLab:
    type: application
    platform: iOS
    sources:
      - path: Sources/AIFinanceTradingLab
    dependencies:
      - target: AIFinanceCore
      - target: AIFinanceUI
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: AIFinance
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceTradingLab
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic

  AIFinanceCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AIFinanceCoreTests
    dependencies:
      - target: AIFinanceCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceCoreTests

  AIFinanceTradingLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/AIFinanceTradingLabUITests
    dependencies:
      - target: AIFinanceTradingLab
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.scholarslab.AIFinanceTradingLabUITests
    # Xcode embeds Testing.framework in the UI-test runner; it loads @rpath/lib_TestingInterop.dylib
    # from …/UITests-Runner.app/usr/lib (see Testing.framework otool). That path is not populated by
    # default, so Simulator launches abort with DYLD “Library missing”. Copy the platform dylib here
    # for iphonesimulator only (device UI tests are uncommon; revisit if needed).
    postBuildScripts:
      - name: Copy lib_TestingInterop into XCTest runner (Simulator)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ "${PLATFORM_NAME:-}" != "iphonesimulator" ]; then
            exit 0
          fi
          SRC="${PLATFORM_DIR}/Developer/usr/lib/lib_TestingInterop.dylib"
          RUNNER="${BUILT_PRODUCTS_DIR}/${XCTRUNNER_PRODUCT_NAME}"
          DST="${RUNNER}/usr/lib"
          if [ ! -d "${RUNNER}" ]; then
            echo "warning: XCTest runner not at ${RUNNER}; skipping lib_TestingInterop copy"
            exit 0
          fi
          if [ ! -f "${SRC}" ]; then
            echo "error: missing ${SRC}" >&2
            exit 1
          fi
          mkdir -p "${DST}"
          cp -f "${SRC}" "${DST}/"
          /usr/bin/codesign --force --sign - --timestamp=none "${DST}/lib_TestingInterop.dylib" 2>/dev/null || true
          /usr/bin/codesign --force --sign - --timestamp=none "${RUNNER}" 2>/dev/null || true

# Explicit scheme so ⌘U / `xcodebuild test` runs the Swift Testing bundle.
schemes:
  AIFinanceTradingLab:
    build:
      targets:
        AIFinanceTradingLab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AIFinanceCoreTests
        - name: AIFinanceTradingLabUITests
